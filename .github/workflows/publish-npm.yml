name: Publish NPM Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Setup JFrog Fly
      uses: jfrog/fly-action@v1
      with:
        url: https://viktorfarcic.jfrog.io

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Publish to JFrog Fly
      run: npm publish
